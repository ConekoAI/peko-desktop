name: Release

# Tag-triggered release build. Produces a draft GitHub release with
# native bundles (deb, AppImage, rpm) attached.
#
# Pushed by tagging: git tag v0.1.0 && git push origin v0.1.0
# Manual re-run for an existing tag: Actions -> Release -> Run workflow,
#   optionally supplying a different tag (e.g. to re-build v0.1.0 after
#   fixing a release-only issue on a hotfix branch).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). Leave empty to use the trigger ref.'
        required: false
        default: ''

permissions:
  # tauri-action creates a draft release and uploads assets; needs write.
  contents: write

concurrency:
  # Never cancel an in-flight release build for the same tag. Key on
  # the resolved tag (input or trigger ref) so manual re-runs for the
  # same tag serialize, rather than racing on the draft release.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Tauri (Linux, release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # When triggered by `workflow_dispatch` with a tag input, check
          # out that tag explicitly (default would be the viewing branch).
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-release-linux

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      # Build the peko-runtime binary from source so the desktop can
      # bundle it as a Tauri sidecar (see ADR-043 and
      # scripts/fetch-peko-sidecar.sh). The desktop's tauri.conf.json
      # declares `bundle.externalBin: ["binaries/peko"]`, which fails
      # the build if the host-triple-suffixed binary is missing.
      #
      # For a tagged release we build peko-runtime at the matching
      # tag so the shipped engine matches the desktop. For a dev
      # dispatch without a tag (or a hotfix that needs a newer engine
      # than the desktop tag), the fallback uses master.
      - name: Build peko-runtime sidecar
        run: |
          RUNTIME_REPO="https://github.com/ConekoAI/peko-runtime.git"
          RUNTIME_DIR="$(mktemp -d)/peko-runtime"
          # When triggered by a tag, use that tag in peko-runtime too.
          # Otherwise default to master so the workflow stays valid for
          # ad-hoc dispatch.
          RUNTIME_REF="${PEKO_RUNTIME_REF:-master}"
          git clone --depth 1 --branch "$RUNTIME_REF" "$RUNTIME_REPO" "$RUNTIME_DIR"
          (cd "$RUNTIME_DIR" && cargo build --release -p peko)
          PEKO_RUNTIME_DIR="$RUNTIME_DIR" bash scripts/fetch-peko-sidecar.sh
        env:
          PEKO_RUNTIME_REF: ${{ inputs.tag || github.ref_name }}

      # Builds release-mode Tauri app and publishes a draft GitHub
      # release with the resulting .deb / .AppImage / .rpm attached.
      # For signed auto-updater artifacts, set TAURI_SIGNING_PRIVATE_KEY
      # and TAURI_SIGNING_PRIVATE_KEY_PASSWORD as repo secrets.
      - name: Build Tauri app (release) and publish draft
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Peko Desktop ${{ inputs.tag || github.ref_name }}'
          releaseDraft: true
          releaseBody: 'See the assets below to download and install.'

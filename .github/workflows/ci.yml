name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Frontend — TypeScript type check, lint, build, unit tests
  # ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npx vitest run --reporter=verbose

  # ─────────────────────────────────────────────────────────────────
  # 2. Rust — fmt, clippy, check, test (Linux)
  # ─────────────────────────────────────────────────────────────────
  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-rust

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Tauri's build script validates `bundle.externalBin` paths exist
      # at compile time (clippy/check, not just `tauri build`). CI does
      # not need a real peko runtime for these jobs — an empty stub at
      # the host-triple-suffixed path is enough to satisfy the check.
      # The real binary only matters for `tauri build`/release.yml.
      - name: Stub sidecar binary for Tauri build
        run: |
          TRIPLE="$(rustc -vV | awk '/^host:/ {print $2}')"
          mkdir -p binaries
          touch "binaries/peko-${TRIPLE}"
          echo "Stubbed binaries/peko-${TRIPLE}"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check

      - name: Run Rust unit tests
        run: cargo test --lib -- --nocapture

  # ─────────────────────────────────────────────────────────────────
  # 3. Rust — check & test (Windows)
  # ─────────────────────────────────────────────────────────────────
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-rust-win

      # See Rust (Linux) for rationale; same stub needed for Tauri's
      # build-script validation of `bundle.externalBin`. Tauri's
      # Windows manifest expects `.exe` suffix on externalBin paths.
      - name: Stub sidecar binary for Tauri build
        run: |
          $line = rustc -vV | Where-Object { $_ -match '^host:' }
          if ($line -match '^host:\s+(\S+)') { $TRIPLE = $matches[1] }
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          New-Item -ItemType File -Force -Path "binaries/peko-$TRIPLE.exe" | Out-Null
          Write-Host "Stubbed binaries/peko-$TRIPLE.exe"

      - name: Cargo check
        run: cargo check

      # Test execution on Windows is `--no-run` because the
      # windows-latest runner's Win32 runtime DLLs don't expose
      # entrypoints that `tauri-plugin-shell`'s transitive deps
      # (`shared_child`/`os_pipe`/`windows-targets`) link against —
      # STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) at process startup.
      # Compilation alone is sufficient coverage on Windows; runtime
      # is exercised by `tauri build` in the Release workflow which
      # uses the same runner and was green before this crate was
      # introduced. Re-evaluate when bumping tauri-plugin-shell.
      - name: Compile Rust unit tests (Windows runner skips execution)
        run: cargo test --lib --no-run

  # ─────────────────────────────────────────────────────────────────
  # 4. Rust — check & test (macOS)
  # ─────────────────────────────────────────────────────────────────
  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-rust-macos

      # See Rust (Linux) for rationale; same stub needed for Tauri's
      # build-script validation of `bundle.externalBin`. Apple Silicon
      # runners currently report aarch64-apple-darwin.
      - name: Stub sidecar binary for Tauri build
        run: |
          TRIPLE="$(rustc -vV | awk '/^host:/ {print $2}')"
          mkdir -p binaries
          touch "binaries/peko-${TRIPLE}"
          echo "Stubbed binaries/peko-${TRIPLE}"

      - name: Cargo check
        run: cargo check

      - name: Run Rust unit tests
        run: cargo test --lib -- --nocapture

  # ─────────────────────────────────────────────────────────────────
  # 5. Security audit
  # ─────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: |
          # `audit.toml` is searched starting from the working directory
          # and walking ancestors. It correctly suppresses the
          # `unic-*` and `glib` warnings, but newer versions of
          # `cargo-audit` (≥0.21) appear to require `--ignore` for
          # the vulnerability (RUSTSEC-2026-0185 quinn-proto) class.
          # The CLI flag is a belt-and-suspenders fallback that
          # matches the entries in `audit.toml` at the repo root.
          #
          # When any of these advisories are resolved upstream, drop
          # the matching `--ignore` from this list AND from
          # `audit.toml` in the same commit.
          cargo audit --ignore RUSTSEC-2025-0075 \
                      --ignore RUSTSEC-2025-0080 \
                      --ignore RUSTSEC-2025-0098 \
                      --ignore RUSTSEC-2025-0100 \
                      --ignore RUSTSEC-2024-0429 \
                      --ignore RUSTSEC-2024-0412 \
                      --ignore RUSTSEC-2024-0413 \
                      --ignore RUSTSEC-2024-0416 \
                      --ignore RUSTSEC-2024-0418 \
                      --ignore RUSTSEC-2026-0185 \
                      --ignore RUSTSEC-2026-0186 \
                      --ignore RUSTSEC-2026-0190 \
                      --ignore RUSTSEC-2026-0194 \
                      --ignore RUSTSEC-2026-0195 \
                      --ignore RUSTSEC-2026-0204

      - name: Audit npm dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Frontend — TypeScript type check, lint, build, unit tests
  # ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: peko-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: peko-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npx vitest run --reporter=verbose

  # ─────────────────────────────────────────────────────────────────
  # 2. Rust — fmt, clippy, check, test (Linux)
  # ─────────────────────────────────────────────────────────────────
  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peko-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: peko-desktop/src-tauri
          shared-key: tauri-rust

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check

      - name: Run Rust unit tests
        run: cargo test --lib -- --nocapture

  # ─────────────────────────────────────────────────────────────────
  # 3. Rust — check & test (Windows)
  # ─────────────────────────────────────────────────────────────────
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: peko-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: peko-desktop/src-tauri
          shared-key: tauri-rust-win

      - name: Cargo check
        run: cargo check

      - name: Run Rust unit tests
        run: cargo test --lib -- --nocapture

  # ─────────────────────────────────────────────────────────────────
  # 4. Rust — check & test (macOS)
  # ─────────────────────────────────────────────────────────────────
  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: peko-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: peko-desktop/src-tauri
          shared-key: tauri-rust-macos

      - name: Cargo check
        run: cargo check

      - name: Run Rust unit tests
        run: cargo test --lib -- --nocapture

  # ─────────────────────────────────────────────────────────────────
  # 5. Tauri build verification (Linux — headless)
  # ─────────────────────────────────────────────────────────────────
  tauri-build-linux:
    name: Tauri Build (Linux)
    runs-on: ubuntu-latest
    needs: [frontend, rust-linux]
    defaults:
      run:
        working-directory: peko-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: peko-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: peko-desktop/src-tauri
          shared-key: tauri-build-linux

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app (debug)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: peko-desktop
          args: --debug

  # ─────────────────────────────────────────────────────────────────
  # 6. Security audit
  # ─────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peko-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Audit npm dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: peko-desktop
          severity: HIGH,CRITICAL
          exit-code: 1

  # ─────────────────────────────────────────────────────────────────
  # 7. Secret scanning
  # ─────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./peko-desktop
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

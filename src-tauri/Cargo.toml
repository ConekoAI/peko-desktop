[package]
name = "peko-desktop"
version = "0.3.0"
description = "Desktop GUI for Peko Runtime"
authors = ["Coneko Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peko_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
notify = "8.2.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures = "0.3"
which = "8.0.6"
dirs = "7"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
toml = "1.1"
urlencoding = "2"
tauri-plugin-window-state = "2.5"
tauri-plugin-os = "2.4"
tauri-plugin-shell = "2"
# PR #6: deep-link handler. Lets the OS route `peko://add-principal?url=…`
# and `https://pekohub.org/p/{owner}/{name}` share links into the
# desktop instead of opening the browser. Same Tauri plugin the
# project already uses for opener/window-state — no new transitive
# dependencies beyond what the plugin pulls in.
tauri-plugin-deep-link = "2.6"
libc = "0.2"
tracing = "0.1"
tauri-plugin-notification = "2.8"
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# The pairing code a phone scans (runtime ADR-108), drawn as SVG.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-updater = "2"
# The install id usage events carry (src/usage.rs).
getrandom = "0.4"
# Crash reports (pekohub ADR-014; src/telemetry.rs). No default features:
# no device or OS context, no session tracking, no logs.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "panic", "reqwest", "rustls"] }


[dev-dependencies]
tempfile = "3"
